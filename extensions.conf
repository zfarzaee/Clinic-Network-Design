; ============================================
; Dialplan Configuration for Clinic
; ============================================

[globals]
TRUNK = SIP/siptrunk

; ============================================
; Internal Context
; ============================================
[internal]

; ============================================
; Doctors Extensions (1001-1020)
; ============================================
exten => _10XX,1,NoOp(Call to Doctor ${EXTEN})
same => n,Dial(SIP/${EXTEN},30)
same => n,Voicemail(${EXTEN}@default,u)
same => n,Hangup()

; ============================================
; Staff Extensions (2001-2010)
; ============================================
exten => _20XX,1,NoOp(Call to Staff ${EXTEN})
same => n,Dial(SIP/${EXTEN},30)
same => n,Voicemail(${EXTEN}@default,u)
same => n,Hangup()

; ============================================
; Support Extensions (3001-3015)
; ============================================
exten => _30XX,1,NoOp(Call to Support ${EXTEN})
same => n,Dial(SIP/${EXTEN},30)
same => n,Voicemail(${EXTEN}@default,u)
same => n,Hangup()

; ============================================
; Post Extensions (4001-4005)
; ============================================
exten => _40XX,1,NoOp(Call to Post ${EXTEN})
same => n,Dial(SIP/${EXTEN},30)
same => n,Voicemail(${EXTEN}@default,u)
same => n,Hangup()

; ============================================
; Reception Queue (2001)
; ============================================
exten => 0,1,NoOp(Call to Reception Queue)
same => n,Queue(reception-queue,t,,,60)
same => n,Voicemail(2001@default,u)
same => n,Hangup()

; ============================================
; Call to Operator
; ============================================
exten => 9,1,Dial(SIP/2001,30)
same => n,Hangup()

; ============================================
; External Calls (SIP Trunk)
; ============================================
exten => _9X.,1,NoOp(Call to external number ${EXTEN:1})
same => n,Dial(${TRUNK}/${EXTEN:1},60)
same => n,Congestion()
same => n,Hangup()

; ============================================
; Voicemail
; ============================================
exten => 8500,1,VoicemailMain(${CALLERID(num)}@default)
same => n,Hangup()

; ============================================
; Emergency Numbers
; ============================================
exten => 112,1,Dial(${TRUNK}/112,30)
same => n,Hangup()

exten => 911,1,Dial(${TRUNK}/911,30)
same => n,Hangup()