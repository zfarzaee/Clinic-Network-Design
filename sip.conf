; ============================================
; SIP Configuration for Clinic
; ============================================

[general]
context = public
allowoverlap = no
udpbindaddr = 0.0.0.0:5060
tcpenable = yes
tcpbindaddr = 0.0.0.0:5060
srvlookup = yes
language = en
nat = no
externip = 192.168.1.100
localnet = 192.168.0.0/16

; ============================================
; SIP Trunk (for external calls)
; ============================================
[siptrunk]
type = peer
host = sip.provider.com
username = clinic_trunk
secret = trunk_password
context = from-trunk
insecure = port,invite
dtmfmode = rfc2833
disallow = all
allow = ulaw
allow = alaw
qualify = yes

; ============================================
; Internal Extensions - Doctors (1001-1020)
; ============================================
[1001](!)
type = friend
host = dynamic
context = internal
qualify = yes
nat = no
directmedia = no
dtmfmode = rfc2833
disallow = all
allow = ulaw
allow = alaw

[1001](1001)
secret = doctor1001
callerid = "Doctor A" <1001>

[1002](1001)
secret = doctor1002
callerid = "Doctor B" <1002>

[1003](1001)
secret = doctor1003
callerid = "Doctor C" <1003>

; ... (up to 1020)

; ============================================
; Internal Extensions - Staff (2001-2010)
