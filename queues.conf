; ============================================
; Queue Configuration for Reception
; ============================================

[general]
persistentmembers = yes
monitor-type = MixMonitor

[reception-queue]
musicclass = default
strategy = ringall
timeout = 60
retry = 5
maxlen = 10
joinempty = yes
leavewhenempty = no
announce-frequency = 30
announce-holdtime = yes
periodic-announce = welcome-message
periodic-announce-frequency = 45

member => SIP/2001
member => SIP/2002
member => SIP/2003